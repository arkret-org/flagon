[workspace]
resolver = "3"
members = ["crates/server", "crates/admin", "crates/contracts", "crates/testing"]
default-members = ["crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/teabay"
homepage = "https://github.com/arkret-org/teabay"
readme = "README.md"
authors = ["Arkret contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bs58 = "0.5.1"
chrono = {version = "0.4.45",features = ["serde"]}
arkret-sdk = {package = "arkret",version = "0.3.0",path = "../arkret-rust-sdk/crates/sdk",default-features = false,features = ["client"]}
arkret-canonical = {version = "0.3.0",path = "../arkret-rust-sdk/crates/canonical",default-features = false}
arkret-egress-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/egress-policy",default-features = false}
arkret-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/identity",default-features = false}
arkret-models-collaboration = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-collaboration",default-features = false}
arkret-models-identity = {version = "0.3.0",path = "../arkret-rust-sdk/crates/models-identity",default-features = false}
arkret-policy = {version = "0.3.0",path = "../arkret-rust-sdk/crates/policy",default-features = false}
arkret-rate-limit = {version = "0.3.0",path = "../arkret-rust-sdk/crates/rate-limit",default-features = false}
arkret-schema = {version = "0.3.0",path = "../arkret-rust-sdk/crates/schema",default-features = false,features = ["embedded-artifacts"]}
arkret-server = {version = "0.3.0",path = "../arkret-rust-sdk/crates/server",default-features = false}
arkret-signatures = {version = "0.3.0",path = "../arkret-rust-sdk/crates/signatures",default-features = false}
arkret-wire = {version = "0.3.0",path = "../arkret-rust-sdk/crates/wire",default-features = false}
deadpool = {version = "0.13",features = ["rt_tokio_1"]}
diesel = {version = "2.3.10",features = ["postgres", "r2d2", "serde_json", "chrono", "uuid", "pq-src"]}
diesel-async = {version = "0.9",features = ["postgres", "deadpool", "async-connection-wrapper"]}
diesel_migrations = {version = "2.3.2",features = ["postgres"]}
dioxus = {version = "0.7.9",default-features = false,features = ["minimal", "asset", "web"]}
dioxus-free-icons = {version = "0.10.0",features = ["lucide"]}
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
gloo-net = "0.7.0"
hmac = "0.13.0"
rand = "0.9.4"
reqwest = {version = "0.13.4",default-features = false,features = ["json", "rustls"]}
salvo = {version = "0.95",default-features = false,features = ["fix-http1-request-uri", "server", "server-handle", "http1", "http2", "matched-path", "affix-state", "cors", "oapi"]}
serde = {version = "1.0.228",features = ["derive"]}
serde_json = "1.0.150"
serde_norway = "0.9"
sha2 = "0.11.0"
teabay-contracts = {version = "0.3.0",path = "crates/contracts"}
teabay-testing = {version = "0.3.0",path = "crates/testing"}
testcontainers-modules = {version = "0.15.0",features = ["blocking", "postgres"]}
tokio = {version = "1.52.3",features = ["macros", "rt-multi-thread", "signal", "sync", "time"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23",features = ["env-filter"]}
url = {version = "2.5.8",features = ["serde"]}
uuid = {version = "1.23.3",features = ["v4", "v7", "serde"]}
voprf = "0.6.0-pre.1"
