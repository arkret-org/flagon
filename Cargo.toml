[workspace]
resolver = "3"
members = ["crates/admin", "crates/contracts", "crates/server"]
default-members = ["crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/teabay"
homepage = "https://github.com/arkret-org/teabay"
readme = "README.md"
authors = ["Arkret contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
arkret-canonical = { version = "0.3.0", path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-egress-reqwest = { version = "0.3.0", path = "../arkret-rust-sdk/crates/egress-reqwest", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identity", default-features = false }
arkret-models-collaboration = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-collaboration", default-features = false }
arkret-models-discovery = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-discovery", default-features = false, features = ["openapi"] }
arkret-models-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-identity", default-features = false }
arkret-policy = { version = "0.3.0", path = "../arkret-rust-sdk/crates/policy", default-features = false }
arkret-rate-limit = { version = "0.3.0", path = "../arkret-rust-sdk/crates/rate-limit", default-features = false }
arkret-schema = { version = "0.3.0", path = "../arkret-rust-sdk/crates/schema", default-features = false }
arkret-sdk = { package = "arkret", version = "0.3.0", path = "../arkret-rust-sdk/crates/sdk", default-features = false, features = ["client"] }
arkret-server = { version = "0.3.0", path = "../arkret-rust-sdk/crates/server", default-features = false }
arkret-signatures = { version = "0.3.0", path = "../arkret-rust-sdk/crates/signatures", default-features = false }
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false }
teabay-contracts = { version = "0.3.0", path = "crates/contracts" }

anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
diesel = { version = "2.3.12", features = ["chrono", "postgres", "pq-src", "r2d2", "serde_json"] }
diesel-async = { version = "0.9", features = ["async-connection-wrapper", "deadpool", "postgres"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["asset", "minimal", "web"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
gloo-net = "0.7.0"
hmac = "0.13.0"
rand = "0.10.2"
rand_09 = { package = "rand", version = "0.9.5" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
salvo = { version = "=0.96.0", default-features = false, features = ["affix-state", "cors", "fix-http1-request-uri", "http1", "http2", "matched-path", "oapi", "rfc9457", "server", "server-handle"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
voprf = { version = "0.6.0-pre.1", features = ["std"] }
