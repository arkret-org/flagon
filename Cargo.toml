[package]
name = "teabay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reference Contrix v1 Directory Service: ingest (push announce + pull subscribe), search/resolve, anti-enumeration filter."
license = "Apache-2.0"
repository = "https://github.com/contrix-dev/teabay"
homepage = "https://github.com/contrix-dev/teabay"
readme = "README.md"
keywords = ["contrix", "directory", "discovery", "salvo", "diesel"]
categories = ["network-programming", "web-programming::http-server"]
authors = ["Contrix contributors"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
contrix-sdk = { package = "contrix", version = "0.7.0", path = "../contrix-rust-sdk/crates/sdk", default-features = false, features = ["full-surface", "client", "salvo"] }
diesel = { version = "2.3.8", features = ["postgres", "r2d2", "serde_json", "chrono", "uuid", "pq-src"] }
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
dotenvy = "0.15.7"
base64 = "0.22.1"
salvo = { version = "0.93.0", features = ["affix-state", "cors", "oapi"] }
salvo-oapi = { version = "0.93.0", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
hmac = "0.12.1"
thiserror = "2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
ulid = "1.1.4"
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }
ed25519-dalek = "2.1.1"
bs58 = "0.5.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = { version = "2.5.4", features = ["serde"] }
async-trait = "0.1.83"
futures-util = "0.3.31"
rand = "0.9.4"
voprf = "0.6.0-pre.1"
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }

[dev-dependencies]
teabay-testing = { version = "0.1.0", path = "teabay-testing" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers-modules = { version = "0.13.0", features = ["blocking", "postgres"] }
