services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chadex
      POSTGRES_PASSWORD: chadex
      POSTGRES_DB: chadex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chadex -d chadex"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - chadex-postgres:/var/lib/postgresql/data

volumes:
  chadex-postgres:
