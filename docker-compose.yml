# flagon Directory Service — local development stack.
#
# Bring up the full stack (postgres + server + admin SPA) with:
#
#   docker compose \
#     --project-directory . \
#     up --build
#
# The two image build contexts both need access to the sibling
# arkret-rust-sdk path; that's wired through `additional_contexts`
# below so the relative path is repo-stable.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flagon
      POSTGRES_PASSWORD: flagon
      POSTGRES_DB: flagon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagon -d flagon"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - flagon-postgres:/var/lib/postgresql/data

  flagon-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      additional_contexts:
        arkret-rust-sdk: ../arkret-rust-sdk
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEABAY_BIND: 0.0.0.0:7781
      DATABASE_URL: postgres://flagon:flagon@postgres:5432/flagon
      # P2E.6 — db connection pool tunables; the defaults below mirror
      # what AppConfig falls back to when these envs are unset.
      TEABAY_DB_POOL_MAX_SIZE: "32"
      TEABAY_DB_POOL_CONNECTION_TIMEOUT_SECS: "5"
      # Admin token — operator MUST supply a real value in production
      # (compose treats unset envs as empty, which disables the admin
      # face entirely; that's the safe default).
      TEABAY_ADMIN_TOKEN: ${TEABAY_ADMIN_TOKEN:-}
      TEABAY_DEVELOPMENT_MODE: "true"
      RUST_LOG: "info,server=debug"
    ports:
      - "7781:7781"
    restart: unless-stopped

  flagon-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      additional_contexts:
        arkret-rust-sdk: ../arkret-rust-sdk
    depends_on:
      - flagon-server
    ports:
      - "8780:8080"
    restart: unless-stopped

volumes:
  flagon-postgres:
