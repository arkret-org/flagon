services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teabay
      POSTGRES_PASSWORD: teabay
      POSTGRES_DB: teabay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teabay -d teabay"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - teabay-postgres:/var/lib/postgresql/data

volumes:
  teabay-postgres:
