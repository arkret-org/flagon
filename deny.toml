# cargo-deny configuration. Run `cargo deny check` locally to mirror the
# supply-chain checks used by sibling Arkret services.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CDLA-Permissive-2.0",
  "PostgreSQL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
# Multiple versions are not silently accepted. Current unavoidable splits are
# listed below and should be removed as upstream SDK/web stack dependencies
# converge.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = [
  # RustCrypto 0.10/0.12 chain retained by cookie/salvo until those upstreams
  # converge on digest 0.11 / hmac 0.13.
  { name = "block-buffer", version = "0.10.4" },
  { name = "crypto-common", version = "0.1.7" },
  { name = "digest", version = "0.10.7" },
  { name = "hmac", version = "0.12.1" },
  { name = "sha2", version = "0.10.9" },

  # RNG versions retained by cookie/salvo and the shared SDK dependency graph.
  { name = "rand", version = "0.8.6" },
  { name = "rand", version = "0.10.1" },
  { name = "rand_core", version = "0.6.4" },
  { name = "rand_core", version = "0.10.1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
