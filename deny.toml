# cargo-deny configuration. Run `cargo deny check` locally to mirror the
# supply-chain checks used by sibling Contrix services.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
ignore = [
  # Dev-only Testcontainers chain. tokio-tar is archived and has no safe
  # upgrade path in testcontainers 0.25.x.
  "RUSTSEC-2025-0111",
  # Dev-only Testcontainers / bollard chain. rustls-pemfile is archived; no
  # safe upgrade is available through current testcontainers.
  "RUSTSEC-2025-0134",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CDLA-Permissive-2.0",
  "PostgreSQL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
