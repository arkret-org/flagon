<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>flagon admin</title>
    <link rel="stylesheet" href="/startup.css">
    <link rel="stylesheet" href="/main.css">
  </head>
  <body>
    <div id="arkret-startup" role="status" aria-live="polite" aria-busy="true">
      <img class="startup-logo" src="/arkret-logo.svg" width="88" height="88" alt="Arkret">
      <div class="startup-brand" aria-hidden="true">ARKRET</div>
      <h1>Flagon Admin</h1>
      <p id="arkret-startup-message">Loading Flagon Admin…</p>
      <span class="startup-spinner" aria-hidden="true"></span>
      <button id="arkret-startup-retry" type="button" hidden>Reload page</button>
      <noscript><p>Enable JavaScript and WebAssembly to open Flagon Admin.</p></noscript>
    </div>
    <div id="app"></div>
    <script type="module" src="/bootstrap.js"></script>
  </body>
</html>
