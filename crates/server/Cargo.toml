arkret-models-identity.workspace = true
arkret-policy.workspace = true
arkret-rate-limit.workspace = true
arkret-schema.workspace = true
arkret-sdk.workspace = true
arkret-server.workspace = true
arkret-signatures.workspace = true
arkret-wire.workspace = true
teabay-contracts.workspace = true

anyhow.workspace = true
base64.workspace = true
bs58.workspace = true
chrono.workspace = true
deadpool.workspace = true
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations.workspace = true
dotenvy.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
rand.workspace = true
reqwest.workspace = true
salvo.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
voprf.workspace = true

[dev-dependencies]
arkret-wire = { workspace = true, features = ["test-support"] }
