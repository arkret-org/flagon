[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reference Arkret v1 Directory Service: ingest (push announce + pull subscribe), search/resolve, anti-enumeration filter."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["arkret", "directory", "discovery", "salvo", "diesel"]
categories = ["network-programming", "web-programming::http-server"]
authors.workspace = true

[package.metadata.cargo-machete]
# Enables Diesel SQL traits for identifier types re-exported through arkret-sdk.
ignored = ["arkret-identifiers"]

[dependencies]
arkret-canonical.workspace = true
arkret-egress-reqwest.workspace = true
arkret-identifiers = { workspace = true, features = ["diesel"] }
arkret-identity.workspace = true
arkret-models-collaboration.workspace = true
