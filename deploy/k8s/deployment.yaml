# Minimal R3 example; production deploys should use Helm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teabay
  labels:
    app: teabay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teabay
  template:
    metadata:
      labels:
        app: teabay
    spec:
      containers:
        - name: teabay
          image: ghcr.io/cokret/teabay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7781
          env:
            - name: TEABAY_BIND
              value: "0.0.0.0:7781"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
