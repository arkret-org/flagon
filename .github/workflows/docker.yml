name: Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, admin]
    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          ref: 5a2d1665e1831ff6e6cefe8a0b09a4d37989b611
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Glory and Sapid sources
        working-directory: flagon
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: flagon
          file: flagon/Dockerfile.${{ matrix.component }}
          build-contexts: arkret-rust-sdk=arkret-rust-sdk
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
