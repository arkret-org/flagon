name: flagon-typos

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          config: flagon/typos.toml
          files: flagon
