name: teabay-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TEABAY_TEST_POSTGRES_TAG: 16-alpine

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Contrix Rust SDK
        uses: actions/checkout@v4
        with:
          repository: contrix-dev/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-unknown-unknown

      - name: Check teabay
        run: cargo check --locked --all-targets

      # rustfmt enforcement was dropped intentionally in commit ab583ba;
      # restore via `cargo fmt --all -- --check` before tagging a release.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test teabay
        run: cargo test --locked

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage
        run: cargo tarpaulin --config tarpaulin.toml --fail-under 70

      - name: Check shared fixtures
        run: cargo check --manifest-path crates/testing/Cargo.toml

      - name: Check admin wasm
        run: cargo check --locked --manifest-path crates/admin/Cargo.toml --target wasm32-unknown-unknown

      - name: Docker conformance
        env:
          TEABAY_RUN_DOCKER_TESTS: "1"
        run: cargo test --locked -p server --test it -- --nocapture

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Contrix Rust SDK
        uses: actions/checkout@v4
        with:
          repository: contrix-dev/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  container-scan:
    name: Docker image Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Contrix Rust SDK
        uses: actions/checkout@v4
        with:
          repository: contrix-dev/contrix-rust-sdk
          path: contrix-rust-sdk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: docker build --build-context contrix-rust-sdk=../contrix-rust-sdk -f Dockerfile.server -t teabay-server:ci .

      - name: Build admin image
        run: docker build --build-context contrix-rust-sdk=../contrix-rust-sdk -f Dockerfile.admin -t teabay-admin:ci .

      - name: Scan server image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: teabay-server:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan admin image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: teabay-admin:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
