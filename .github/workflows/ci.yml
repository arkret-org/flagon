name: teabay-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TEABAY_TEST_POSTGRES_TAG: 16-alpine

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teabay
          POSTGRES_PASSWORD: teabay
          POSTGRES_DB: teabay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teabay -d teabay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEABAY_TEST_DATABASE_URL: postgres://teabay:teabay@localhost:5432/teabay_ci
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Check teabay
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test teabay
        run: cargo test --locked --workspace

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage
        # Instrumented builds must retain OpenSSL linkage for bundled libpq.
        env:
          RUSTFLAGS: "-C link-arg=-lssl -C link-arg=-lcrypto"
        run: cargo tarpaulin --config tarpaulin.toml --fail-under 70

      - name: Check admin wasm
        run: cargo check --locked --manifest-path crates/admin/Cargo.toml --target wasm32-unknown-unknown

      # The database service starts empty; this test audits its migrated schema
      # and must execute in addition to the ordinary workspace tests.
      - name: PostgreSQL fresh-schema isolation
        run: cargo test --locked -p server --lib fresh_schema_has_only_empty_public_realm_index -- --include-ignored --nocapture

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  container-scan:
    name: Docker image Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: teabay

    steps:
      - name: Checkout teabay
        uses: actions/checkout@v4
        with:
          path: teabay

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: docker build --build-context arkret-rust-sdk=../arkret-rust-sdk -f Dockerfile.server -t teabay-server:ci .

      - name: Build admin image
        run: docker build --build-context arkret-rust-sdk=../arkret-rust-sdk -f Dockerfile.admin -t teabay-admin:ci .

      - name: Verify server runtime and HTTP health probe
        run: |
          trap 'docker rm --force teabay-ci-server teabay-ci-postgres >/dev/null 2>&1 || true; docker network rm teabay-ci-net >/dev/null 2>&1 || true' EXIT
          docker network create teabay-ci-net
          docker run --detach --name teabay-ci-postgres --network teabay-ci-net \
            --env POSTGRES_USER=teabay --env POSTGRES_PASSWORD=teabay \
            --env POSTGRES_DB=teabay_ci postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec teabay-ci-postgres pg_isready --username=teabay; then break; fi
            sleep 1
          done
          docker run --detach --name teabay-ci-server --network teabay-ci-net \
            --health-interval=1s --health-start-period=1s \
            --env DATABASE_URL=postgres://teabay:teabay@teabay-ci-postgres:5432/teabay_ci \
            --env TEABAY_SERVICE_DID=did:web:teabay.example \
            --env TEABAY_SERVICE_METHOD_HISTORY_HEAD=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --env TEABAY_SERVICE_VERSION_ID=1-ci-version \
            --env TEABAY_ADMIN_CSRF_TOKEN=ci-csrf-token teabay-server:ci
          healthy=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' teabay-ci-server)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          docker logs teabay-ci-server
          test "$healthy" = true

      - name: Verify admin runtime and SPA fallback
        run: |
          trap 'docker rm --force teabay-ci-admin >/dev/null 2>&1 || true' EXIT
          docker run --detach --name teabay-ci-admin teabay-admin:ci
          for attempt in $(seq 1 30); do
            if docker exec teabay-ci-admin wget --quiet --tries=1 --spider http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          docker exec teabay-ci-admin wget --quiet --tries=1 --spider http://127.0.0.1:8080/health
          docker exec teabay-ci-admin wget --quiet --output-document=/tmp/root.html http://127.0.0.1:8080/
          docker exec teabay-ci-admin wget --quiet --output-document=/tmp/fallback.html http://127.0.0.1:8080/ci-deep-route
          docker exec teabay-ci-admin cmp /tmp/root.html /tmp/fallback.html

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: teabay-server:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: teabay-admin:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
