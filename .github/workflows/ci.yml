name: flagon-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLAGON_TEST_POSTGRES_TAG: 16-alpine

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flagon
          POSTGRES_PASSWORD: flagon
          POSTGRES_DB: flagon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagon -d flagon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAGON_TEST_DATABASE_URL: postgres://flagon:flagon@localhost:5432/flagon_ci
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: flagon

    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Prepare Glory and Sapid sources
        shell: bash
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default stable
          rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --package admin --package flagon-contracts --package server -- --check

      - name: Check flagon
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test flagon
        run: cargo test --locked --workspace

      # The database service starts empty; this test audits its migrated schema
      # and must execute in addition to the ordinary workspace tests.
      - name: PostgreSQL fresh-schema isolation
        run: cargo test --locked -p server --lib fresh_schema_has_only_empty_public_realm_index -- --include-ignored --nocapture

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage
        # Instrumented builds must retain OpenSSL linkage for bundled libpq.
        env:
          RUSTFLAGS: "-C link-arg=-lssl -C link-arg=-lcrypto"
        run: cargo tarpaulin --config tarpaulin.toml --fail-under 70

  admin-wasm:
    name: Admin wasm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: flagon
    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon
      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
      - name: Prepare Glory and Sapid sources
        shell: bash
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Build audit console
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 scripts/build-admin-web.py --release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise audit-console layout and actions
        env:
          FLAGON_E2E_CHANNEL: chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          export FLAGON_E2E_WEB_DIR="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/web")')"
          npm run test:admin

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flagon

    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Prepare Glory and Sapid sources
        shell: bash
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  container-scan:
    name: Docker image Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flagon

    steps:
      - name: Checkout flagon
        uses: actions/checkout@v4
        with:
          path: flagon

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Glory and Sapid sources
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Build server image
        run: docker build --build-context arkret-rust-sdk=../arkret-rust-sdk --build-context glory=../../glory-rs/glory --build-context sapid=../../glory-rs/sapid -f Dockerfile.server -t flagon-server:ci .

      - name: Build admin image
        run: docker build --build-context arkret-rust-sdk=../arkret-rust-sdk --build-context glory=../../glory-rs/glory --build-context sapid=../../glory-rs/sapid -f Dockerfile.admin -t flagon-admin:ci .

      - name: Verify server runtime and HTTP health probe
        run: |
          trap 'docker rm --force flagon-ci-server flagon-ci-postgres >/dev/null 2>&1 || true; docker network rm flagon-ci-net >/dev/null 2>&1 || true' EXIT
          docker network create flagon-ci-net
          docker run --detach --name flagon-ci-postgres --network flagon-ci-net \
            --env POSTGRES_USER=flagon --env POSTGRES_PASSWORD=flagon \
            --env POSTGRES_DB=flagon_ci postgres:16-alpine
          postgres_ready=false
          for _ in $(seq 1 30); do
            if docker exec --env PGPASSWORD=flagon flagon-ci-postgres \
              psql --host=127.0.0.1 --username=flagon --dbname=flagon_ci \
              --no-password --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [ "$postgres_ready" != true ]; then
            docker logs flagon-ci-postgres
            echo "::error::PostgreSQL never accepted a TCP query against the application database"
            exit 1
          fi
          docker run --detach --name flagon-ci-server --network flagon-ci-net \
            --health-interval=1s --health-start-period=1s \
            --env DATABASE_URL=postgres://flagon:flagon@flagon-ci-postgres:5432/flagon_ci \
            --env FLAGON_SERVICE_DID=did:web:flagon.example \
            --env FLAGON_SERVICE_METHOD_HISTORY_HEAD=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --env FLAGON_SERVICE_VERSION_ID=1-ci-version \
            --env FLAGON_ADMIN_CSRF_TOKEN=ci-csrf-token flagon-server:ci
          healthy=false
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' flagon-ci-server)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          docker logs flagon-ci-server
          if [ "$healthy" != true ]; then
            docker logs flagon-ci-postgres
            exit 1
          fi

      - name: Verify admin runtime and SPA fallback
        run: |
          trap 'docker rm --force flagon-ci-admin >/dev/null 2>&1 || true' EXIT
          docker run --detach --name flagon-ci-admin flagon-admin:ci
          for _ in $(seq 1 30); do
            if docker exec flagon-ci-admin wget --quiet --tries=1 --spider http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          docker exec flagon-ci-admin wget --quiet --tries=1 --spider http://127.0.0.1:8080/health
          docker exec flagon-ci-admin wget --quiet --output-document=/tmp/root.html http://127.0.0.1:8080/
          docker exec flagon-ci-admin wget --quiet --output-document=/tmp/fallback.html http://127.0.0.1:8080/ci-deep-route
          docker exec flagon-ci-admin cmp /tmp/root.html /tmp/fallback.html

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flagon-server:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flagon-admin:ci
          scan-type: image
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
